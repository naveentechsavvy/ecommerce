# Local development stack.
#   docker compose up -d                 -> Postgres + Keycloak (run API & UIs from your IDE / npm)
#   docker compose --profile full up -d  -> also builds and runs the Spring Boot API
name: apparel-commerce

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: commerce
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: commerce
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init-keycloak-db.sql:/docker-entrypoint-initdb.d/10-keycloak.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce -d commerce"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      # Tokens carry this issuer whether requested from the browser or from inside the network
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_PORT: 8080
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/apparel-realm.json:/opt/keycloak/data/import/apparel-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: ["full"]
    build: ../backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/commerce
      DB_USER: commerce
      DB_PASSWORD: commerce
      KEYCLOAK_ISSUER: http://localhost:8180/realms/apparel
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/apparel/protocol/openid-connect/certs
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

volumes:
  pgdata:
