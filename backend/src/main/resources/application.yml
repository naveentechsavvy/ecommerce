server:
  port: 8080
  error:
    include-message: always

spring:
  application:
    name: commerce-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/commerce}
    username: ${DB_USER:commerce}
    password: ${DB_PASSWORD:commerce}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none   # Flyway owns the schema
    properties:
      hibernate:
        jdbc.time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          # JWKS is fetched over the internal network; the issuer is validated against the public URL
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8180/realms/apparel/protocol/openid-connect/certs}

app:
  security:
    issuer: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/apparel}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:5174}
  checkout:
    currency: INR
    free-shipping-threshold: 999
    flat-shipping-fee: 79
  chat:
    # Leave empty to run the assistant in offline (keyword search) mode
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    model: ${CHAT_MODEL:claude-opus-5-5}
    max-tool-iterations: 6
    max-history-messages: 20

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
